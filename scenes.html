<title>Bungalow Scene Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 16:9 stage (the frame you screen-record for Flow) with the scene strip and transport below. */
:root{
  --bg:#0d0c0b; --panel:#171512; --line:#2c2823; --fg:#ece6dc; --dim:#9a9285;
  --gold:#f0b24a; --gold-ink:#1a1206; --night:#06080c;
  color-scheme:dark;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-x:hidden}
#stage{position:relative;width:min(100%,calc((100dvh - 190px)*16/9));aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;flex:none;touch-action:none}
body.clean #stage{width:min(100%,calc((100dvh - 24px)*16/9))}
body.clean #ui{display:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#hud{position:absolute;left:0;right:0;top:0;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px #000;pointer-events:none}
#cap{position:absolute;left:6%;right:6%;bottom:6%;text-align:center;font-size:clamp(12px,2.4vw,22px);line-height:1.35;color:#fff;text-shadow:0 1px 8px #000,0 0 2px #000;min-height:1.4em;pointer-events:none}
#cap b{color:var(--gold);font-weight:600;margin-right:.4em}
#ui{width:min(100%,calc((100dvh - 190px)*16/9));display:flex;flex-direction:column;gap:10px;min-width:0}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
#chips button{flex:none;min-width:38px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:6px;font:600 13px var(--mono);cursor:pointer}
#chips button[aria-current="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar button{height:38px;padding:0 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;font:600 13px var(--ui);cursor:pointer}
#bar button:hover,#chips button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#scrub{flex:1;min-width:140px;accent-color:var(--gold)}
#time{font:13px var(--mono);color:var(--dim);min-width:84px;text-align:right}
#info{display:flex;flex-direction:column;gap:2px;min-width:0}
#info h1{margin:0;font-size:17px;font-weight:650;text-wrap:balance}
#info p{margin:0;color:var(--dim);font-size:13px;line-height:1.45;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="fade"></div>
  <div id="hud"><span id="hl"></span><span id="hr"></span></div>
  <div id="cap"></div>
</div>
<div id="ui">
  <div id="chips" role="tablist" aria-label="Scenes"></div>
  <div id="bar">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <input id="scrub" type="range" min="0" max="10" step="0.01" value="0" aria-label="Scene time">
    <span id="time">0.0 / 10 s</span>
    <button id="clean" type="button">Clean view</button>
  </div>
  <div id="info"><h1 id="ttl"></h1><p id="how">Drag on the picture to look around while paused. Use Clean view, then screen-record the frame, or use the start and end stills.</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const W=THREE, PI=Math.PI;
let seed=7;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const lerp=(a,b,t)=>a+(b-a)*t;

const canvas=document.getElementById('c');
const renderer=new W.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=W.PCFSoftShadowMap;
renderer.toneMapping=W.ACESFilmicToneMapping;renderer.outputEncoding=W.sRGBEncoding;
const scene=new W.Scene();
const camera=new W.PerspectiveCamera(42,16/9,.05,400);

/* ---------- helpers ---------- */
function M(c,o){return new W.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o||{}));}
function mat(c,o){return (c&&c.isMaterial)?c:M(c,o);}
function box(p,w,h,d,c,x,y,z,o){const m=new W.Mesh(new W.BoxGeometry(w,h,d),mat(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}
function slab(p,x0,x1,y0,y1,z0,z1,c,o){return box(p,x1-x0,y1-y0,z1-z0,c,(x0+x1)/2,(y0+y1)/2,(z0+z1)/2,o);}
function cyl(p,rt,rb,h,c,x,y,z,o,seg){const m=new W.Mesh(new W.CylinderGeometry(rt,rb,h,seg||14),mat(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}
function sph(p,r,c,x,y,z,o,sx,sy,sz){const m=new W.Mesh(new W.SphereGeometry(r,14,10),mat(c,o));m.position.set(x,y,z);if(sx)m.scale.set(sx,sy,sz);m.castShadow=true;p.add(m);return m;}
function cv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new W.CanvasTexture(c);t.encoding=W.sRGBEncoding;t.anisotropy=4;return t;}
function plank(a,b,rx,ry){const t=cv(256,256,(g)=>{g.fillStyle=a;g.fillRect(0,0,256,256);for(let i=0;i<8;i++){g.fillStyle=i%2?b:a;g.fillRect(i*32,0,32,256);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(i*32,0,2,256);}for(let i=0;i<260;i++){g.fillStyle='rgba(0,0,0,'+(rnd()*.08)+')';g.fillRect(rnd()*256,rnd()*256,2+rnd()*30,1);}});t.wrapS=t.wrapT=W.RepeatWrapping;t.repeat.set(rx,ry);return t;}
function glowTex(r,g2,b){return cv(128,128,(g,w,h)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,`rgba(${r},${g2},${b},1)`);gr.addColorStop(.35,`rgba(${r},${g2},${b},.35)`);gr.addColorStop(1,`rgba(${r},${g2},${b},0)`);g.fillStyle=gr;g.fillRect(0,0,w,h);});}
function glowPlane(p,w,h,x,y,z,col,op){const m=new W.Mesh(new W.PlaneGeometry(w,h),new W.MeshBasicMaterial({map:glowTex(...col),transparent:true,opacity:op,blending:W.AdditiveBlending,depthWrite:false,fog:false}));m.position.set(x,y,z);p.add(m);return m;}
function skyDome(top,mid,bot){const t=cv(8,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,top);gr.addColorStop(.5,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,w,h);});const m=new W.Mesh(new W.SphereGeometry(250,24,16),new W.MeshBasicMaterial({map:t,side:W.BackSide,fog:false,depthWrite:false}));m.renderOrder=-10;return m;}
function lantern(p,x,y,z,inten,col){const g=new W.Group();g.position.set(x,y,z);cyl(g,.05,.06,.04,0x222,0,.2,0);box(g,.16,.26,.16,M(0xffd9a0,{emissive:0xffb050,emissiveIntensity:1.6}),0,0,0);cyl(g,.01,.01,.3,0x222,0,.35,0);p.add(g);const l=new W.PointLight(col||0xffb868,inten,14,2);l.position.set(x,y,z);p.add(l);return l;}
function addHemi(g,sky,gr,i){const h=new W.HemisphereLight(sky,gr,i);g.add(h);return h;}

/* ---------- people ---------- */
function pattern(base,dot,n,sz){const t=cv(128,128,(g)=>{g.fillStyle=base;g.fillRect(0,0,128,128);for(let i=0;i<n;i++){g.fillStyle=dot[i%dot.length];g.beginPath();g.arc(rnd()*128,rnd()*128,sz*(.6+rnd()*.8),0,7);g.fill();}});return t;}
const SPEC={
 stany:{shirt:0xc9a465,pants:0x3a3f4b,hair:0x1a1410,skin:0xc99a6f,pack:0x8a3b2c,sun:true,h:1.0},
 renjith:{shirt:pattern('#1d2a3d',['#3d5473','#2a3a55'],40,3),pants:0x23252b,hair:0x15110e,skin:0xb98a62,pack:0x2b3a4a,h:1.02},
 jesvin:{shirt:0x6b7340,pants:0x2f3c56,hair:0x1b1511,skin:0xc3926a,pack:0x4a5a3a,glasses:true,beard:true,curly:true,h:.99},
 hashir:{shirt:pattern('#1b2a2c',['#e0577a','#f0a050','#e8d070'],34,3.4),pants:0x8a7a58,hair:0x16110d,skin:0xbd8d64,pack:0x7a5a2a,beard:true,curly:true,camera:true,h:.96}
};
function mkPerson(name){
 const s=SPEC[name],g=new W.Group(),inner=new W.Group();g.add(inner);
 const skin=M(s.skin,{roughness:.7}),dark=M(0x0a0a0a,{roughness:.4});
 const shirt=(typeof s.shirt==='number')?M(s.shirt):M(0xffffff,{map:s.shirt});
 const pants=M(s.pants);
 const legs=[];
 for(const sx of[-1,1]){const hip=new W.Group();hip.position.set(sx*.13,.86,0);const th=box(hip,.22,.46,.26,pants,0,-.23,0);const kn=new W.Group();kn.position.set(0,-.46,0);const sh=box(kn,.19,.44,.22,pants,0,-.22,0);box(kn,.2,.1,.32,0x1b1512,0,-.46,.04);hip.add(kn);inner.add(hip);legs.push({hip,kn});}
 const torso=new W.Group();torso.position.y=1.22;inner.add(torso);
 box(torso,.56,.7,.3,shirt,0,0,0);
 if(name==='jesvin'){box(torso,.5,.16,.34,M(0x5b6336),0,.05,0);}
 box(torso,.6,.06,.34,M(0x2a2018),0,-.3,0);
 const pk=box(inner,.4,.5,.2,M(s.pack),0,1.25,-.26);
 box(inner,.07,.55,.04,M(0x222),-.2,1.25,.15);box(inner,.07,.55,.04,M(0x222),.2,1.25,.15);
 const arms=[];
 for(const sx of[-1,1]){const sd=new W.Group();sd.position.set(sx*.35,1.52,0);box(sd,.14,.34,.15,shirt,0,-.17,0);const el=new W.Group();el.position.set(0,-.34,0);box(el,.12,.3,.13,skin,0,-.15,0);sph(el,.07,skin,0,-.33,0);sd.add(el);inner.add(sd);arms.push({sd,el});}
 const head=new W.Group();head.position.y=1.8;inner.add(head);
 sph(head,.18,skin,0,0,0,{roughness:.65},1,1.08,1);
 for(const sx of[-1,1]){sph(head,.034,0xffffff,sx*.07,.02,.155,{roughness:.3},1,1,.6);sph(head,.018,dark,sx*.07,.02,.185,{roughness:.2});box(head,.07,.014,.02,dark,sx*.07,.075,.165);}
 box(head,.07,.014,.02,M(0x7a3a2a),0,-.085,.17);
 sph(head,.02,skin,0,-.02,.185);
 sph(head,.2,s.hair,0,.07,-.02,null,1,.86,1.02);
 if(s.curly){for(let i=0;i<14;i++){const a=rnd()*PI*2,e=rnd()*1.1;sph(head,.065,s.hair,Math.cos(a)*Math.cos(e)*.17,.1+Math.sin(e)*.16,Math.sin(a)*Math.cos(e)*.17-.02);}}
 if(s.beard){sph(head,.15,s.hair,0,-.08,.045,null,1,.6,.8);}
 if(s.sun){box(head,.3,.05,.05,0x0a0a0a,0,.2,.1);}
 if(s.glasses){for(const sx of[-1,1]){const t=new W.Mesh(new W.TorusGeometry(.05,.008,6,14),M(0x111111));t.position.set(sx*.07,.025,.19);head.add(t);}box(head,.04,.008,.008,0x111111,0,.03,.19);}
 if(s.camera){box(torso,.2,.13,.1,0x151515,0,-.06,.2);cyl(torso,.04,.04,.05,0x333344,0,-.06,.27,{metalness:.5,roughness:.3}).rotation.x=PI/2;box(torso,.03,.5,.02,0x151515,0,.12,.14);}
 g.userData={inner,legs,arms,torso,head,name,h:s.h};
 g.scale.setScalar(s.h*.93);
 return g;
}
const PEOPLE={};['stany','renjith','jesvin','hashir'].forEach(n=>{PEOPLE[n]=mkPerson(n);PEOPLE[n].visible=false;scene.add(PEOPLE[n]);});
const AR={down:[[0,0],[0,0]],fwd:[[-PI/2,0],[-PI/2,0]],rfwd:[[0,0],[-PI/2,-.12]],lfwd:[[-PI/2,.12],[0,0]],fist:[[0,0],[0,2.9]],wide:[[0,-1.45],[0,1.45]],hold:[[-.9,.25],[-.9,-.25]],cross:[[-.8,.5],[-.8,-.5]],cam:[[-1.3,.2],[-1.3,-.2]],pull:[[-1.25,0],[-1.25,0]]};
function poseP(p,o,lt,time){
 const u=p.userData,A=AR[o.arms||'down'];
 const sit=o.sit,lie=o.lie,walk=o.walk;
 let ph=time*6.5+(u.name.length*1.3);
 u.inner.rotation.set(0,0,0);u.inner.position.set(0,0,0);
 u.torso.scale.y=1+Math.sin(time*1.7+u.name.length)*.012;
 for(let i=0;i<2;i++){const L=u.legs[i];L.hip.rotation.set(0,0,0);L.kn.rotation.set(0,0,0);
  if(sit){L.hip.rotation.x=-PI/2;L.kn.rotation.x=PI/2;}
  if(walk){const s=Math.sin(ph+i*PI);L.hip.rotation.x=s*.6;L.kn.rotation.x=Math.max(0,-s)*.9;}}
 for(let i=0;i<2;i++){const a=u.arms[i];a.sd.rotation.set(A[i][0],0,A[i][1]);a.el.rotation.set(0,0,0);
  if(walk&&(o.arms||'down')==='down'){a.sd.rotation.x=Math.sin(ph+(1-i)*PI)*.55;a.el.rotation.x=-.3;}
  if(o.arms==='fist'&&i===1)a.el.rotation.x=-.2;}
 u.head.rotation.set(Math.sin(time*.9)*.02,(o.look||0)+Math.sin(time*.6+u.name.length)*.04,Math.sin(time*.7)*.02);
 if(sit)u.inner.position.y=-.34;
 if(o.floor)u.inner.position.y=-.72;
 if(walk)u.inner.position.y+=Math.abs(Math.sin(ph))*.035;
 if(lie){u.inner.rotation.x=-PI/2;u.inner.position.y=.28;u.inner.position.z=0;}
 if(o.lean)u.inner.rotation.x=o.lean;
}

/* ---------- environments ---------- */
const ENV={};

function door3(parent,x,z,opts){ // carved banyan door, hinge on the left; returns {pivot,panel,knob}
 const tex=cv(256,384,(g,w,h)=>{g.fillStyle='#2a170c';g.fillRect(0,0,w,h);g.strokeStyle='#ffb83a';g.lineCap='round';g.lineWidth=7;g.beginPath();g.moveTo(128,350);g.lineTo(128,200);g.stroke();for(let i=0;i<9;i++){const a=-PI/2+(i-4)*.35;g.lineWidth=5-Math.abs(i-4)*.35;g.beginPath();g.moveTo(128,215);g.quadraticCurveTo(128+Math.cos(a)*50,215+Math.sin(a)*60,128+Math.cos(a)*(90+rnd()*20),215+Math.sin(a)*(110+rnd()*20));g.stroke();}for(let i=0;i<60;i++){g.fillStyle='rgba(255,190,60,'+(.5+rnd()*.5)+')';g.beginPath();g.arc(128+(rnd()-.5)*190,120+rnd()*100-(Math.abs(rnd()-.5)*40),3+rnd()*4,0,7);g.fill();}g.lineWidth=3;for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(128+i*8,350);g.quadraticCurveTo(128+i*18,370,128+i*26,384);g.stroke();}g.strokeStyle='rgba(255,170,50,.8)';g.lineWidth=4;g.strokeRect(8,8,w-16,h-16);});
 const pivot=new W.Group();pivot.position.set(x-.85,0,z);parent.add(pivot);
 const panel=box(pivot,1.7,2.9,.14,M(0xffffff,{map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:opts&&opts.em!==undefined?opts.em:1.1,roughness:.6}),.85,1.45,0);
 const knob=sph(pivot,.07,M(0xcaa24a,{metalness:.8,roughness:.3}),1.5,1.25,.14);
 return {pivot,panel,knob};
}
function wallClock(g,x,y,z,ry){const c=new W.Group();c.position.set(x,y,z);c.rotation.y=ry;g.add(c);const f=cyl(c,.5,.5,.08,M(0xe9e1cf),0,0,0);f.rotation.x=PI/2;const ring=new W.Mesh(new W.TorusGeometry(.5,.05,8,28),M(0x3a2414));c.add(ring);for(let i=0;i<12;i++){const a=i*PI/6;box(c,.03,.08,.02,0x222,Math.sin(a)*.42,Math.cos(a)*.42,.05).rotation.z=-a;}
 const mh=new W.Group(),hh=new W.Group();c.add(mh);c.add(hh);const m1=box(mh,.025,.4,.02,0x111,0,.2,.07),h1=box(hh,.035,.28,.02,0x111,0,.14,.065);return {c,mh,hh};}

ENV.study=function(){
 const g=new W.Group(),u={};
 const fl=M(0xffffff,{map:plank('#523824','#44301f',5,5),roughness:.65});
 slab(g,-5,5,-.1,0,-6,6,fl);slab(g,-5,5,4,4.1,-6,6,0x1b130d);
 const wc=M(0x3c2b20);slab(g,-5.2,-5,0,4,-6,6,wc);slab(g,5,5.2,0,4,-6,6,wc);slab(g,-5,5,0,4,-6.2,-6,wc);slab(g,-5,5,0,4,6,6.2,wc);
 slab(g,-5,5,0,.2,-6,-5.9,0x1e140d);
 const cols=[0x7b2d2d,0x2d4a6b,0x4a6b3a,0x6b5a2a,0x5a2d6b,0x2a2a2a,0x8a6a3a];
 for(const s of[-1,1])for(let r=0;r<5;r++){const y=.4+r*.72;box(g,.55,.05,8,0x2a1b10,s*4.7,y,0);for(let k=0;k<30;k++){const hh=.4+rnd()*.25;box(g,.38,hh,.07+rnd()*.06,cols[(rnd()*cols.length)|0],s*4.7,y+.03+hh/2,-3.8+k*.26+rnd()*.1);}}
 const d=door3(g,0,-5.88);u.door=d;
 u.frame=new W.Group();g.add(u.frame);box(u.frame,.2,3.1,.3,0x1a0f08,-1.05,1.55,-5.95);box(u.frame,.2,3.1,.3,0x1a0f08,1.05,1.55,-5.95);box(u.frame,2.3,.2,.3,0x1a0f08,0,3.1,-5.95);
 u.glow=glowPlane(g,7,5.5,0,1.7,-5.6,[255,170,60],.9);
 u.light=new W.PointLight(0xffb040,1.6,16,2);u.light.position.set(0,1.8,-4.8);g.add(u.light);
 box(g,2.6,.5,.7,0x2a1a0f,0,.25,-5.5);
 const rug=box(g,5,.02,6,M(0x5a1f1f),0,.01,1);
 u.clock=wallClock(g,-3,2.8,-5.86,0);
 u.hemi=addHemi(g,0x4a4a66,0x1a1410,.3);
 const cl2=new W.PointLight(0xffd8a0,.9,7,2);cl2.position.set(-3,3.0,-4.2);g.add(cl2);
 const fill=new W.PointLight(0x7a8cff,.25,20,2);fill.position.set(0,3.5,4);g.add(fill);
 u.sky=null;u.bg=0x07060a;u.fog=[0x07060a,10,28];
 u.update=(sh,lt)=>{const dm=sh.door||'show',k=dm==='hide'?0:dm==='show'?1:sm(lt/(sh.d*.75));
  d.pivot.visible=k>0.001;u.frame.visible=k>0.001;d.pivot.position.y=-3.3*(1-k);u.frame.position.y=-3.3*(1-k);
  u.glow.visible=k>0.02;u.glow.material.opacity=.9*k;u.light.intensity=1.7*k;
  const op=sh.open?lerp(sh.open[0],sh.open[1],sm(lt/sh.d)):0;d.pivot.rotation.y=-op;
  d.knob.rotation.z=sh.knob?sm(lt/sh.d)*1.2:0;
  const ck=sh.clock||[59,59];const mn=lerp(ck[0],ck[1],clamp(lt/(sh.d*.9),0,1));
  u.clock.mh.rotation.z=-(mn/60)*PI*2;u.clock.hh.rotation.z=-((2+mn/60)/12)*PI*2;};
 g.userData=u;return g;};

function stairs(g,x0,x1){const m=M(0x5a3d26);for(let i=0;i<13;i++){slab(g,x0,x1,0,.3*(i+1),1.7-i*.6,2.3-i*.6,m);}box(g,.08,1.0,12.6,0x2a1a10,x0-.04,2.8,-1.9).rotation.x=Math.atan(.5)*-1;}
ENV.hall=function(){
 const g=new W.Group(),u={};

/* ---------- player ---------- */
const st={sc:0,t:0,play:true,free:false,shot:-1,cur:null};
const $=id=>document.getElementById(id);
function build(){const ch=$('chips');SC.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=i+1;b.title=s.t;b.onclick=()=>go(i);ch.appendChild(b);});}
function shotAt(sc,t){let a=0;for(let i=0;i<sc.shots.length;i++){const d=sc.shots[i].d;if(t<a+d||i===sc.shots.length-1)return{i,lt:Math.min(t-a,d),sh:sc.shots[i]};a+=d;}}
function setEnv(sh){for(const k in ENVS)ENVS[k].visible=false;const e=getEnv(sh.env);e.visible=true;const u=e.userData;scene.background=new W.Color(u.bg);scene.fog=new W.Fog(u.fog[0],u.fog[1],u.fog[2]);renderer.toneMappingExposure=sh.exp||1;st.env=e;}
function applyShot(i,sh){setEnv(sh);st.shot=i;st.cur=sh;for(const n in PEOPLE)PEOPLE[n].visible=false;
 const e=st.env.userData;if(e.journal)e.journal.visible=!!sh.journal;}
const look=new W.Vector3(),pos=new W.Vector3(),tp=new W.Vector3(),tl=new W.Vector3();
function evalCam(sh,lt){const k=sh.cam;let i=0;while(i<k.length-1&&lt>=k[i+1][0])i++;const a=k[i],b=k[Math.min(i+1,k.length-1)];const f=b[0]===a[0]?0:sm((lt-a[0])/(b[0]-a[0]));
 const P=(v)=>v==='jeep'?ENVS.road.userData.jeep.position:null;
 const jl=ENVS.road&&ENVS.road.userData.jeep.position;const la=a[2]==='jeep'?[jl.x,jl.y+1,jl.z]:a[2],lb=b[2]==='jeep'?[jl.x,jl.y+1,jl.z]:b[2];
 pos.set(lerp(a[1][0],b[1][0],f),lerp(a[1][1],b[1][1],f),lerp(a[1][2],b[1][2],f));look.set(lerp(la[0],lb[0],f),lerp(la[1],lb[1],f),lerp(la[2],lb[2],f));}
function frame(time){
 const sc=SC[st.sc];const r=shotAt(sc,st.t);if(r.i!==st.shot)applyShot(r.i,r.sh);
 const sh=r.sh,lt=r.lt;const e=st.env.userData;
 e.update&&e.update(sh,lt);
 if(e.dome)e.dome.position.copy(camera.position);
 const used=new Set();
 for(const c of sh.chars){const [n,x,z,ry,o0]=c,o=o0||{};const p=PEOPLE[n];p.visible=true;used.add(n);const mv=o.move||[0,0,0];p.position.set(x+mv[0]*lt,(o.y||0)+(mv[2]||0)*lt+(o.sy?sy(z+mv[1]*lt):0),z+mv[1]*lt);
  if(o.stair)p.position.y=sy(p.position.z);
  p.rotation.y=ry;poseP(p,o,lt,time);}
 if(sh.env==='hall'&&sh.chars.some(c=>c[1]>3&&c[1]<4.5&&c[2]<2.5)){for(const c of sh.chars){const p=PEOPLE[c[0]];if(p.position.x>3&&p.position.x<4.5&&p.position.z<2.2)p.position.y=Math.max(0,sy(p.position.z));}}
 if(!st.free){evalCam(sh,lt);camera.position.copy(pos);camera.lookAt(look);st.lookT=look.clone();}
 $('fade').style.opacity=sh.fade?String(sm(lt/sh.d)):'0';
 // caption
 const L=sc.l,n=L.length,idx=Math.min(n-1,Math.floor(st.t/10*n));const cur=L[idx];$('cap').innerHTML=st.t<9.8?'<b>'+cur[0].charAt(0).toUpperCase()+cur[0].slice(1)+'</b>'+cur[1]:'';
 $('hl').textContent='Scene '+(st.sc+1)+' / 20 · '+sc.t;$('hr').textContent='Shot '+(r.i+1)+' of '+sc.shots.length;
 $('time').textContent=st.t.toFixed(1)+' / 10 s';$('scrub').value=st.t;
 renderer.render(scene,camera);
}
function go(i,t){st.sc=clamp(i,0,SC.length-1);st.t=t||0;st.shot=-1;st.free=false;[...$('chips').children].forEach((b,j)=>b.setAttribute('aria-current',j===st.sc?'true':'false'));$('ttl').textContent=(st.sc+1)+'. '+SC[st.sc].t+' · '+SC[st.sc].mood;try{history.replaceState(null,'','#s'+(st.sc+1));}catch(e){}}
let last=performance.now(),clock0=last;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(st.play){st.t+=dt;if(st.t>=10){st.t=10;st.play=false;$('play').textContent='Replay';}}frame((now-clock0)/1000);requestAnimationFrame(loop);}
function resize(){const s=$('stage');const w=s.clientWidth,h=s.clientHeight;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
$('play').onclick=()=>{if(st.t>=10){st.t=0;st.free=false;st.shot=-1;}st.play=!st.play;if(st.play)st.free=false;$('play').textContent=st.play?'Pause':'Play';};
$('restart').onclick=()=>{st.t=0;st.free=false;st.play=true;st.shot=-1;$('play').textContent='Pause';};
$('scrub').oninput=e=>{st.t=parseFloat(e.target.value);st.play=false;st.free=false;$('play').textContent='Play';};
$('clean').onclick=()=>{document.body.classList.toggle('clean');setTimeout(resize,30);};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(st.sc+1);else if(e.key==='ArrowLeft')go(st.sc-1);else if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='Escape'&&document.body.classList.contains('clean')){$('clean').click();}});
addEventListener('resize',resize);
let drag=null;
$('stage').addEventListener('pointerdown',e=>{if(document.body.classList.contains('clean')&&!drag){}drag={x:e.clientX,y:e.clientY};$('stage').setPointerCapture(e.pointerId);});
$('stage').addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)<3)return;drag={x:e.clientX,y:e.clientY};
 if(!st.free){st.free=true;st.play=false;$('play').textContent='Play';st.freeT=(st.lookT||new W.Vector3()).clone();}
 const off=camera.position.clone().sub(st.freeT);const sp=new W.Spherical().setFromVector3(off);sp.theta-=dx*.006;sp.phi=clamp(sp.phi-dy*.006,.2,PI-.2);off.setFromSpherical(sp);camera.position.copy(st.freeT).add(off);camera.lookAt(st.freeT);});
$('stage').addEventListener('pointerup',()=>{drag=null;});$('stage').addEventListener('pointercancel',()=>{drag=null;});
$('stage').addEventListener('wheel',e=>{e.preventDefault();if(!st.free){st.free=true;st.play=false;$('play').textContent='Play';st.freeT=(st.lookT||new W.Vector3()).clone();}const off=camera.position.clone().sub(st.freeT);off.multiplyScalar(clamp(1+e.deltaY*.001,.8,1.25));camera.position.copy(st.freeT).add(off);camera.lookAt(st.freeT);},{passive:false});

build();resize();
const h=/^#s(\d+)$/.exec(location.hash);go(h?parseInt(h[1])-1:0);
for(const k of Object.keys(ENV))getEnv(k);
window.__vb={go,st,frame,resize,SC,renderer,setPlay:(v)=>{st.play=v;}};
requestAnimationFrame(loop);
})();
